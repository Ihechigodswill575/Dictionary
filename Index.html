<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scientific Calculator - By AYOMIDE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .creator-badge {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 25px;
            margin-bottom: 15px;
            text-align: center;
        }

        .creator-badge h3 {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .creator-badge p {
            color: #e0e0e0;
            font-size: 12px;
            margin-top: 3px;
        }

        .calculator {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 100%;
        }

        .display {
            background: #0f3460;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            min-height: 90px;
        }

        .display-history {
            color: #888;
            font-size: 14px;
            min-height: 20px;
            text-align: right;
            word-wrap: break-word;
            overflow-x: auto;
        }

        .display-result {
            color: #fff;
            font-size: 36px;
            text-align: right;
            margin-top: 10px;
            word-wrap: break-word;
            font-weight: 500;
            overflow-x: auto;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        button {
            background: #16213e;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            padding: 18px 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        button:active {
            transform: scale(0.95);
            opacity: 0.8;
        }

        .operator {
            background: #e94560;
            font-size: 20px;
        }

        .function {
            background: #533483;
            font-size: 14px;
        }

        .clear {
            background: #d63447;
        }

        .equals {
            background: #00d9ff;
            color: #000;
            font-weight: 600;
        }

        .span-2 {
            grid-column: span 2;
        }

        .mode-toggle {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .mode-btn {
            background: #16213e;
            padding: 10px 24px;
            font-size: 14px;
            border-radius: 8px;
            touch-action: manipulation;
        }

        .mode-btn.active {
            background: #e94560;
        }

        .footer {
            margin-top: 15px;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
        }

        /* Mobile optimizations */
        @media (max-width: 480px) {
            body {
                padding: 5px;
            }

            .creator-badge {
                padding: 8px 16px;
                margin-bottom: 10px;
            }

            .creator-badge h3 {
                font-size: 14px;
            }

            .creator-badge p {
                font-size: 11px;
            }

            .calculator {
                padding: 15px;
                border-radius: 15px;
            }

            .display {
                padding: 15px;
                min-height: 80px;
            }

            .display-result {
                font-size: 32px;
            }

            button {
                padding: 16px 6px;
                font-size: 15px;
                border-radius: 10px;
            }

            .function {
                font-size: 13px;
            }

            .operator {
                font-size: 18px;
            }

            .buttons {
                gap: 6px;
            }
        }

        @media (max-width: 360px) {
            .display-result {
                font-size: 28px;
            }

            button {
                padding: 14px 4px;
                font-size: 14px;
            }

            .function {
                font-size: 12px;
            }

            .mode-btn {
                padding: 8px 18px;
                font-size: 13px;
            }
        }

        /* Landscape mode on mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                padding: 5px;
            }

            .creator-badge {
                padding: 6px 14px;
                margin-bottom: 8px;
            }

            .creator-badge h3 {
                font-size: 12px;
            }

            .creator-badge p {
                font-size: 10px;
            }

            .calculator {
                padding: 10px;
            }

            .display {
                padding: 12px;
                min-height: 60px;
                margin-bottom: 10px;
            }

            .display-result {
                font-size: 24px;
                margin-top: 5px;
            }

            .display-history {
                font-size: 12px;
            }

            button {
                padding: 12px 6px;
                font-size: 14px;
            }

            .function {
                font-size: 11px;
            }

            .mode-toggle {
                margin-bottom: 10px;
            }

            .mode-btn {
                padding: 6px 16px;
                font-size: 12px;
            }

            .footer {
                margin-top: 8px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="creator-badge">
        <h3>CREATED BY AYOMIDE</h3>
        <p>Scientific Calculator</p>
    </div>

    <div class="calculator">
        <div class="mode-toggle">
            <button class="mode-btn active" id="degBtn">DEG</button>
            <button class="mode-btn" id="radBtn">RAD</button>
        </div>
        
        <div class="display">
            <div class="display-history" id="history"></div>
            <div class="display-result" id="result">0</div>
        </div>

        <div class="buttons">
            <!-- Row 1 -->
            <button class="function" onclick="applyFunction('sin')">sin</button>
            <button class="function" onclick="applyFunction('cos')">cos</button>
            <button class="function" onclick="applyFunction('tan')">tan</button>
            <button class="function" onclick="applyFunction('log')">log</button>
            <button class="function" onclick="applyFunction('ln')">ln</button>

            <!-- Row 2 -->
            <button class="function" onclick="applyFunction('asin')">sin⁻¹</button>
            <button class="function" onclick="applyFunction('acos')">cos⁻¹</button>
            <button class="function" onclick="applyFunction('atan')">tan⁻¹</button>
            <button class="function" onclick="insertValue('π')">π</button>
            <button class="function" onclick="insertValue('e')">e</button>

            <!-- Row 3 -->
            <button class="function" onclick="applyFunction('sqrt')">√</button>
            <button class="function" onclick="needsSecondNumber('^')">x^y</button>
            <button class="function" onclick="applyPower(2)">x²</button>
            <button class="function" onclick="applyPower(3)">x³</button>
            <button class="function" onclick="applyFunction('reciprocal')">1/x</button>

            <!-- Row 4 -->
            <button class="function" onclick="insertValue('(')">(</button>
            <button class="function" onclick="insertValue(')')">)</button>
            <button class="function" onclick="applyFunction('factorial')">n!</button>
            <button class="clear" onclick="clearAll()">AC</button>
            <button class="clear" onclick="backspace()">⌫</button>

            <!-- Row 5 -->
            <button onclick="insertValue('7')">7</button>
            <button onclick="insertValue('8')">8</button>
            <button onclick="insertValue('9')">9</button>
            <button class="operator" onclick="insertValue('/')">÷</button>
            <button class="function" onclick="needsSecondNumber('%')">%</button>

            <!-- Row 6 -->
            <button onclick="insertValue('4')">4</button>
            <button onclick="insertValue('5')">5</button>
            <button onclick="insertValue('6')">6</button>
            <button class="operator" onclick="insertValue('*')">×</button>
            <button class="function" onclick="applyFunction('abs')">|x|</button>

            <!-- Row 7 -->
            <button onclick="insertValue('1')">1</button>
            <button onclick="insertValue('2')">2</button>
            <button onclick="insertValue('3')">3</button>
            <button class="operator" onclick="insertValue('-')">−</button>
            <button class="function" onclick="applyFunction('exp')">exp</button>

            <!-- Row 8 -->
            <button onclick="insertValue('0')">0</button>
            <button onclick="insertValue('.')">.</button>
            <button onclick="toggleSign()">+/−</button>
            <button class="operator" onclick="insertValue('+')">+</button>
            <button class="equals" onclick="calculate()">=</button>
        </div>

        <div class="footer">
            © 2024 AYOMIDE - All Rights Reserved
        </div>
    </div>

    <script>
        let currentInput = '';
        let history = '';
        let angleMode = 'deg';
        let waitingForSecondOperand = false;
        let pendingOperation = null;

        const resultDisplay = document.getElementById('result');
        const historyDisplay = document.getElementById('history');
        const degBtn = document.getElementById('degBtn');
        const radBtn = document.getElementById('radBtn');

        degBtn.addEventListener('click', () => {
            angleMode = 'deg';
            degBtn.classList.add('active');
            radBtn.classList.remove('active');
        });

        radBtn.addEventListener('click', () => {
            angleMode = 'rad';
            radBtn.classList.add('active');
            degBtn.classList.remove('active');
        });

        function insertValue(value) {
            if (waitingForSecondOperand) {
                currentInput = value;
                waitingForSecondOperand = false;
            } else {
                currentInput += value;
            }
            updateDisplay();
        }

        function updateDisplay() {
            resultDisplay.textContent = currentInput || '0';
        }

        function clearAll() {
            currentInput = '';
            history = '';
            waitingForSecondOperand = false;
            pendingOperation = null;
            historyDisplay.textContent = '';
            updateDisplay();
        }

        function backspace() {
            currentInput = currentInput.slice(0, -1);
            updateDisplay();
        }

        function toggleSign() {
            if (currentInput && currentInput !== '0') {
                if (currentInput.startsWith('-')) {
                    currentInput = currentInput.slice(1);
                } else {
                    currentInput = '-' + currentInput;
                }
                updateDisplay();
            }
        }

        function toRadians(degrees) {
            return degrees * Math.PI / 180;
        }

        function toDegrees(radians) {
            return radians * 180 / Math.PI;
        }

        function applyFunction(func) {
            try {
                if (!currentInput || currentInput === '0') return;
                
                let value = parseFloat(currentInput);
                let result;
                let displayFunc = func;

                switch(func) {
                    case 'sin':
                        result = angleMode === 'deg' 
                            ? Math.sin(toRadians(value)) 
                            : Math.sin(value);
                        break;
                    case 'cos':
                        result = angleMode === 'deg' 
                            ? Math.cos(toRadians(value)) 
                            : Math.cos(value);
                        break;
                    case 'tan':
                        result = angleMode === 'deg' 
                            ? Math.tan(toRadians(value)) 
                            : Math.tan(value);
                        break;
                    case 'asin':
                        result = Math.asin(value);
                        result = angleMode === 'deg' ? toDegrees(result) : result;
                        displayFunc = 'sin⁻¹';
                        break;
                    case 'acos':
                        result = Math.acos(value);
                        result = angleMode === 'deg' ? toDegrees(result) : result;
                        displayFunc = 'cos⁻¹';
                        break;
                    case 'atan':
                        result = Math.atan(value);
                        result = angleMode === 'deg' ? toDegrees(result) : result;
                        displayFunc = 'tan⁻¹';
                        break;
                    case 'log':
                        result = Math.log10(value);
                        break;
                    case 'ln':
                        result = Math.log(value);
                        break;
                    case 'sqrt':
                        result = Math.sqrt(value);
                        displayFunc = '√';
                        break;
                    case 'exp':
                        result = Math.exp(value);
                        break;
                    case 'abs':
                        result = Math.abs(value);
                        displayFunc = '|x|';
                        break;
                    case 'factorial':
                        if (value < 0 || !Number.isInteger(value)) {
                            throw new Error('Invalid input');
                        }
                        result = 1;
                        for (let i = 2; i <= value; i++) {
                            result *= i;
                        }
                        displayFunc = 'x!';
                        break;
                    case 'reciprocal':
                        result = 1 / value;
                        displayFunc = '1/x';
                        break;
                    default:
                        return;
                }

                result = Math.round(result * 1e10) / 1e10;
                history = displayFunc + '(' + currentInput + ')';
                currentInput = result.toString();
                historyDisplay.textContent = history;
                updateDisplay();
            } catch (error) {
                resultDisplay.textContent = 'Error';
                currentInput = '';
            }
        }

        function applyPower(power) {
            try {
                if (!currentInput || currentInput === '0') return;
                
                let value = parseFloat(currentInput);
                let result = Math.pow(value, power);
                
                result = Math.round(result * 1e10) / 1e10;
                history = currentInput + '^' + power;
                currentInput = result.toString();
                historyDisplay.textContent = history;
                updateDisplay();
            } catch (error) {
                resultDisplay.textContent = 'Error';
                currentInput = '';
            }
        }

        function needsSecondNumber(operator) {
            insertValue(operator);
        }

        function calculate() {
            try {
                if (!currentInput) return;
                
                history = currentInput;
                let expression = prepareExpression(currentInput);
                let result = eval(expression);
                
                result = Math.round(result * 1e10) / 1e10;
                currentInput = result.toString();
                historyDisplay.textContent = history + ' =';
                updateDisplay();
            } catch (error) {
                resultDisplay.textContent = 'Error';
                currentInput = '';
            }
        }

        function prepareExpression(expr) {
            expr = expr.replace(/π/g, Math.PI);
            expr = expr.replace(/e(?![a-z])/g, Math.E);
            expr = expr.replace(/\^/g, '**');
            return expr;
        }

        document.addEventListener('keydown', (event) => {
            const key = event.key;
            
            if (key >= '0' && key <= '9' || key === '.') {
                insertValue(key);
            } else if (key === '+' || key === '-' || key === '*' || key === '/') {
                insertValue(key);
            } else if (key === 'Enter') {
                event.preventDefault();
                calculate();
            } else if (key === 'Escape') {
                clearAll();
            } else if (key === 'Backspace') {
                backspace();
            } else if (key === '(' || key === ')') {
                insertValue(key);
            }
        });
    </script>
</body>
</html>
